# .github/workflows/ci.yml
#
# This is our Continuous Integration (CI) pipeline.
# It runs automatically every time code is pushed to GitHub
# or a Pull Request is opened — on ANY branch.
#
# A "workflow" is a set of automated jobs GitHub runs for us
# on their servers, completely free for public repositories.

name: CI — Frontend checks  # The name shown in GitHub's Actions tab

# ── When to run this workflow ──────────────────────────────────────────
# "on" defines the trigger events.
on:
  push:
    branches: ["**"]   # Run on pushes to every branch
  pull_request:
    branches: ["**"]   # Run on every pull request too

# ── Jobs ───────────────────────────────────────────────────────────────
# A workflow contains one or more "jobs".
# Jobs run in parallel by default — ours run sequentially
# because each one depends on the previous passing.
jobs:

  # ── Job 1: Type check ────────────────────────────────────────────────
  # TypeScript's compiler (tsc) checks every file for type errors.
  # --noEmit means "check but don't produce output files" —
  # we just want the error report, not compiled JavaScript.
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest  # GitHub spins up a fresh Ubuntu Linux machine

    steps:
      # Step 1: Check out your code onto the GitHub machine
      # Without this, the machine has no idea what your code looks like.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js on the machine
      # We pin to Node 20 — the same version you use locally.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Cache npm dependencies so subsequent runs are faster.
          # Instead of downloading all packages fresh every time,
          # GitHub reuses the cached node_modules if package.json hasn't changed.
          cache: "npm"

      # Step 3: Install all project dependencies
      # "npm ci" is like "npm install" but stricter and faster —
      # it installs exactly what's in package-lock.json with no surprises.
      - name: Install dependencies
        run: npm ci

      # Step 4: Run the TypeScript compiler in check-only mode
      - name: Run TypeScript check
        run: npx tsc --noEmit

  # ── Job 2: Lint check ─────────────────────────────────────────────────
  # ESLint checks your code for common mistakes and style issues.
  # This job only runs if the typecheck job passed.
  lint:
    name: ESLint check
    runs-on: ubuntu-latest
    needs: typecheck  # "needs" means: only run this if typecheck passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0
        # --max-warnings 0 means even warnings fail the pipeline.
        # This keeps code quality high — warnings are just errors
        # we haven't fixed yet.

  # ── Job 3: Build check ────────────────────────────────────────────────
  # Vite builds the entire app into production-ready files.
  # If the build fails, we know something is deeply broken.
  # This job only runs if lint passed.
  build:
    name: Production build check
    runs-on: ubuntu-latest
    needs: lint  # Only run if lint passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build the app — if this succeeds, the code is deployable
      - name: Run production build
        run: npm run build

      # Upload the built files as a downloadable artifact.
      # This means after every successful CI run, you can download
      # the exact production build from GitHub's Actions tab —
      # useful for debugging deployment issues.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/        # Vite outputs to the dist/ folder
          retention-days: 7  # Keep it for 7 days then auto-delete